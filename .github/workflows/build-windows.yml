name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pytest -q
      - run: python -m PyInstaller --clean --noconfirm YouTubeOBSChat.spec
      - run: python scripts/smoke_bundle.py dist/YouTubeOBSChat.exe
      - name: Prepare release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-package, release-assets | Out-Null
          Copy-Item dist/YouTubeOBSChat.exe, README.md, VALIDATION.md, THIRD_PARTY_NOTICES.md, LICENSE -Destination release-package
          Copy-Item licenses -Destination release-package -Recurse
          Compress-Archive -Path release-package/* -DestinationPath release-assets/YouTubeOBSChat-Windows-x64.zip
          Copy-Item dist/YouTubeOBSChat.exe -Destination release-assets
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release-assets/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeOBSChat-Windows-x64
          if-no-files-found: error
          path: release-assets/*
      - name: Publish tested Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG release-assets/YouTubeOBSChat.exe release-assets/YouTubeOBSChat-Windows-x64.zip release-assets/SHA256SUMS.txt --verify-tag --title "YouTube OBS 双语弹幕 $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
