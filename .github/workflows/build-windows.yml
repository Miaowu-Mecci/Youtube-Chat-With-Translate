name: Build Windows EXE
on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pytest -q
      - run: python -m PyInstaller --clean --noconfirm YouTubeOBSChat.spec
      - run: python scripts/smoke_bundle.py dist/YouTubeOBSChat.exe
      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeOBSChat-Windows-x64
          if-no-files-found: error
          path: |
            dist/YouTubeOBSChat.exe
            README.md
            THIRD_PARTY_NOTICES.md
            LICENSE
            licenses/
