[project]
name = "youtube-obs-bilingual-chat"
version = "0.1.1"
description = "Local YouTube live chat overlay with bilingual translation for OBS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "grpcio>=1.78,<2", "protobuf>=6.33.5,<7", "websockets>=14,<17"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "grpcio-tools>=1.78,<1.79"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.proto" = ["*.proto"]
